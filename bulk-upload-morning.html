டுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அ ரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉"];

function disableAll(){
  document.getElementById('clearBtn').disabled=true;
  document.getElementById('addBtn').disabled=true;
}

async function upload(){
  let done=0;
  const total=MSGS.length;
  for(let i=0;i<total;i++){
    try{
      await db.ref('kovil_messages/morning').push({text:MSGS[i],msgNum:i+1,addedAt:Date.now()});
      done++;
      const pct=Math.round((done/total)*100);
      document.getElementById('bar').style.width=pct+'%';
      document.getElementById('bar').textContent=pct+'%';
      document.getElementById('count').textContent=done+' / '+total+' uploaded';
      document.getElementById('status').textContent='⬆️ Uploading M-'+(i+1)+'...';
      if(i<3){
        const d=document.createElement('div');
        d.className='preview';
        d.innerHTML='<b>M-'+(i+1)+':</b> '+MSGS[i].substring(0,80)+'...';
        document.getElementById('log').appendChild(d);
      }
    }catch(e){console.error(e);}
    await new Promise(r=>setTimeout(r,50));
  }
  document.getElementById('status').innerHTML='<span class="done">✅ Done! '+done+' messages uploaded!</span>';
  document.getElementById('bar').style.width='100%';
  document.getElementById('bar').textContent='100%';
}

async function clearAndUpload(){
  disableAll();
  document.getElementById('status').textContent='🗑 Clearing old messages...';
  try{
    await db.ref('kovil_messages/morning').remove();
    document.getElementById('status').textContent='✅ Cleared! Uploading...';
    await upload();
  }catch(e){
    document.getElementById('status').textContent='❌ Error: '+e.message;
  }
}

async function addOnly(){
  disableAll();
  document.getElementById('status').textContent='⬆️ Adding messages...';
  await upload();
}
</script>
