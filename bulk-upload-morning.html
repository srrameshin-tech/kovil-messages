const MSGS=["*ஸ்ரீ வீரமாத்தி அம்மன்* துணையோடு இன்று தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *வளமாகட்டும்.* 🙏", "ஒவ்வொரு புதிய நாளும் ஒரு *புதிய வாய்ப்பு* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. 💪", "இன்று உங்கள் நாள் *அற்புதமாக* இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிரம்பட்டும். 😊", "*விதை விதைத்தவனே* விளைவு அறுப்பான் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஉழைப்பின் *பலன்* நிச்சயம். 📖", "*காலை வணக்கம்!* இன்று நல்ல நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சிறப்பாக* தொடங்குங்கள். 🌅", "*அம்மா வீரமாத்தி* ஆசீர்வாதம் உங்கள் மீது பொழியட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *வளமாகட்டும்.* 🌸", "நேற்றை விட இன்று *சிறப்பாக* இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வளர்ச்சி* தொடரட்டும். 🌟", "வாழ்க்கை *அழகானது* — ரசியுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிரம்பட்டும். 🌈", "*ஊருக்கு உதவுவதே* உண்மையான வாழ்க்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nநல்ல *பெயர்* கிடைக்கட்டும். 🌿", "*காலை வணக்கம்!* இன்று உங்களுக்கு நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* வரட்டும். ☀️", "*முனியப்பன் காவல்* நம்மை சுற்றி இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nபாதுகாப்பு *உறுதி.* 🔱", "*கனவு கண்டவர்கள்* மட்டுமே வெற்றி பெறுவார்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* நிச்சயம். 🚀", "*அன்பும் கருணையும்* உங்கள் வலிமை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *செழிக்கட்டும்.* 💝", "*கல்வி கற்றவன்* கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஞானம் *பெருகட்டும்.* 📚", "*புதிய நாள்* புதிய நம்பிக்கை — நல்ல காலை! —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. 🌄", "*தெய்வ அருளோடு* இன்றைய நாளை தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *ஒளிரட்டும்.* 🪔", "*உழைப்பே* உயர்வுக்கு சிறந்த வழி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிரந்தரம். 💡", "*நல்ல எண்ணங்கள்* நல்ல வாழ்க்கையை உருவாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *அழகாகட்டும்.* 🌻", "*உழைத்தவன் உண்பான்* — சோம்பேறி தவிப்பான் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nமுயற்சி *நிறைவேறட்டும்.* 🌾", "*காலை வணக்கம்!* இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிரம்பட்டும். 🌸", "*அம்மன் பாதம்* பணிந்து நாளை தொடங்குவோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *வளமாகட்டும்.* 🌺", "*விடியல் வந்தால்* விதியை வெல்லலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நம்பிக்கை* நிலைக்கட்டும். 🌄", "இன்று *நன்றாக சாப்பிடுங்கள்* — நன்றாக வாழுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஆரோக்கியம் *பெருகட்டும்.* ☀️", "*சொட்டு சொட்டாய்* தண்ணீர் சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nமுயற்சி *தொடரட்டும்.* 💧", "*வணக்கம்!* இன்றைய நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* உங்களுக்காகவே. ⭐", "*வீரமாத்தி அம்மன்* கருணை என்றும் நம்மோடு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதெய்வ *பாதுகாப்பு* உறுதி. ✨", "*சோர்வு வந்தாலும்* சுறுசுறுப்பாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வலிமை* பெருகட்டும். 💎", "உங்கள் *புன்னகை* யாரோ ஒருவரின் நாளை மாற்றும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*அன்பு* பரவட்டும். 💫", "*வேரோடு நின்ற மரம்* புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவலிமை *நிலைக்கட்டும்.* 🌳", "*தெய்வ அருளோடு* நாளை தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *ஒளிரட்டும்.* 🌺", "*இறைவன் அருளால்* இன்று அனைத்தும் நன்றாக நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* வரட்டும். 🙏", "*தோல்வி என்பது* வெற்றிக்கான படிக்கட்டு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிரந்தரம். 🏆", "*சின்ன சின்ன மகிழ்ச்சிகளை* ரசியுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *இனிமையாகட்டும்.* 🌟", "*இல்லறம் நல்லறம்* — குடும்பம் சிறப்பது முதன்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகுடும்பம் *சந்தோஷமாகட்டும்.* 🏠", "*காலை வணக்கம்!* இன்று உங்கள் சிரிப்பு அழகாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* பொங்கட்டும். 🌟", "*அம்மா அருள்* உங்கள் வாழ்வை வளமாக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *பிரகாசிக்கட்டும்.* 🌷", "*சிறு முயற்சியும்* பெரிய மாற்றத்தை தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. 🌱", "*ஆரோக்கியம் செல்வம்* — அதை காத்துக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *நலமாகட்டும்.* 💚", "*நேரம் கடந்த பின்* வருந்தினால் பயனில்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nநேரத்தை *சரியாக* பயன்படுத்துங்கள். ⚡", "*காலை வணக்கம்!* ஆரோக்கியமாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *நலமாகட்டும்.* 💫", "*முனியப்பன் திருவருள்* உங்களுக்கு கிடைக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வளம்* பெருகட்டும். 🔱", "*உங்கள் திறமையை* நம்புங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* நிச்சயம். ⭐", "*மனசமாதானம்* மிகவும் முக்கியம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nமன *அமைதி* நிலைக்கட்டும். 🕊️", "*கடலை கண்டாலும்* கால் வாங்காதவன் மீனவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதைரியம் *பெருகட்டும்.* 🌊", "*குடும்பத்தோடு* மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஅன்பு *நிரம்பட்டும்.* 🌻", "*தெய்வ நம்பிக்கையோடு* இன்று முன்னேறுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிரந்தரம். 🪔", "*தைரியமாக முன்னேறுங்கள்* — வெற்றி காத்திருக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nசாதனை *நிச்சயம்.* 🦁", "இன்று *யாரையாவது உதவுங்கள்* — மகிழ்ச்சி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* திரும்பும். 🌺", "*உயரப் பறக்க வேண்டுமானால்* சிறகை விரிக்க வேண்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. 🦅", "*வணக்கம்!* இன்று எல்லாம் நன்றாக நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* பெருகட்டும். 🌈", "*அம்மன் சரணம்!* இன்று நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *மலரட்டும்.* 🌸", "*இன்றைய முயற்சி* நாளைய வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* உறுதி. 💪", "*குடும்பத்தோடு* நேரம் செலவிடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகுடும்பம் *சந்தோஷமாகட்டும்.* 😊", "*அறிவு ஒரு விளக்கு* — அது ஒருபோதும் அணையாது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஞானம் *பெருகட்டும்.* 📖", "*இன்று கண் திறந்தது* கடவுளின் வரம் — நன்றி சொல்லுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*கடவுள்* துணை. 🌅", "*இறை அருளால்* உங்கள் கஷ்டங்கள் தீரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நிம்மதி* கிடைக்கட்டும். ✨", "*மனதில் உறுதி* இருந்தால் எதுவும் சாத்தியம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிரந்தரம். 🌟", "*கோபத்தை விடுங்கள்* — மன அமைதி கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nமன *சாந்தி* நிலைக்கட்டும். 🌈", "*பொறுமையே* பெரிய ஆற்றல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* வரட்டும். 🌿", "*புதிய சூரியன்* புதிய நம்பிக்கை — காலை வணக்கம்! —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* ஒளிரட்டும். ☀️", "*வீரமாத்தி அம்மன்* உங்கள் குடும்பத்தை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nபாதுகாப்பு *உறுதி.* 🙏", "*ஒவ்வொரு நிமிடமும்* மதிப்புமிக்கது — வீணாக்காதீர்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வை *சிறப்பாக்குங்கள்.* 🚀", "*நேர்மையாக இருங்கள்* — நல்லது வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* திரும்பும். 💝", "*சிறியோரை மதி* — பெரியோரை கொண்டாடு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *நலமாகட்டும்.* 📚", "*புதிய நாள்* புதிய நம்பிக்கை — நல்ல காலை! —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. 🌄", "*தெய்வம் நம்மோடு* இருக்கும்போது யாரை அஞ்சுவோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*தைரியம்* பெருகட்டும். 🌺", "*கஷ்டங்கள்* உங்களை வலிமையாக்குகின்றன —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வலிமை* கூடட்டும். 💡", "*பொறுமை* மிகவும் சக்திவாய்ந்தது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிரந்தரம். 🌻", "இன்று நன்றாக வாழ்வோம் — *நாளை* என்ன வரும் என்று அறியோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*இன்றை* சிறப்பாக்குங்கள். 🌾", "*காலை வணக்கம்!* இன்றும் இறைவன் அருளோடு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* இனிமையாகட்டும். 🌸", "*அம்மன் துணையோடு* இன்று வெற்றி நிச்சயம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* உறுதி. 🔱", "*புன்னகையோடு* தொடங்கும் நாள் நன்றாக முடியும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிரம்பட்டும். 🌄", "இன்று *ஒரு நல்ல காரியம்* செய்யுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* கிடைக்கட்டும். ☀️", "*ஒரு நல்ல வார்த்தை* ஆயிரம் கத்திகளை விட கூர்மையானது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாக்கு *நலமாகட்டும்.* 💧", "*கண் விழித்ததே பாக்கியம்* — இன்றை நாளை சிறப்பாக்குவோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* காத்திருக்கிறது. ⭐", "*இறைவன் நாமம்* உச்சரித்து நாளை தொடங்குவோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *ஒளிரட்டும்.* 🪔", "*நீங்கள் செய்வதை* சிறப்பாக செய்யுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* உறுதி. 💎", "*மற்றவர்களை மதியுங்கள்* — மரியாதை பெறுவீர்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*பெருமை* கிடைக்கட்டும். 💫", "*நல்லவர்களோடு நட* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல பண்பு* வளரட்டும். 🌳", "*வணக்கம்!* இன்று உங்கள் முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* பொங்கட்டும். 🌺", "*ஸ்ரீ வீரமாத்தி அம்மன் சங்ககிரி* — உங்கள் அன்னை காக்கிறாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*கஷ்டமான பாதை* — தான் வெற்றியை தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*இன்றை நினைவுகளே* — நாளைய புன்னகை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*கொடுத்தவன் குறைவடையான்* — இது உலக நியதி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! ஸ்ரீ வீரமாத்தி* — அம்மன் இன்று உங்களை வழிநடத்தட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*முனியப்பன் ஆணை* — இன்று எந்த தீங்கும் நெருங்காது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*தன்னம்பிக்கை* — மிகப்பெரிய ஆயுதம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*சிறிய* — மகிழ்ச்சிகளை கொண்டாடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*மனிதன் மனிதனுக்கு உதவுவதே* — மிகப் பெரிய தர்மம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*நல்ல காலை! இன்று செய்யும்* — நல்ல காரியம் பலன் தரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*தெய்வத்தை நம்பி வாழுங்கள்* — வாழ்க்கை வளமாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*இன்று தொடங்கினால்* — நாளை வெற்றி பெறலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உங்கள் வாழ்க்கை உங்கள் படைப்பு* — அழகாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*படிப்பு மட்டுமல்ல* — பண்பும் வேண்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*வணக்கம்! காலை* — கடவுளை வணங்கி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*அம்மன் அருள் பெற்றவர்களுக்கு* — அறம் துணை நிற்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*சாதிப்பவர்கள் ஒருபோதும்* — விட மாட்டார்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*யாரையும் நோகடிக்காதீர்கள்* — இதுவே தர்மம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*சிறு வயதில்* — கற்றது சிலைமேல் கோலம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்! இன்று* — உங்கள் உடல் ஆரோக்கியமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*இறைவனை நினைத்தே* — இன்றைய பணிகளை தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*எழுந்திரு முயற்சி* — செய் வெற்றி பெறு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*இன்று சந்தோஷமாக இருங்கள்* — உடல் ஆரோக்கியமாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*தீய நட்பை* — விட தனிமை மேல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*நல்ல காலை!* — இன்று யாரையாவது உதவுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*வீரமாத்தி அருள் பெற்று* — இன்று வெற்றி பெறுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*இன்றை கினால்* — தான் நாளை இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*உங்கள் அன்பு* — உலகை மாற்றும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*ஒரு நல்ல செயல்* — ஆயிரம் ஆண்டுகள் நிலைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*காலை வணக்கம்!* — இன்றும் நல்லவர்களோடு இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*முனியப்பன் பாதம் பணிந்து வேண்டுவோம்* — பலிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*ஒவ்வொரு நாளும் ஒரு போட்டி* — வெல்லுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*மற்றவர்களின்* — மகிழ்ச்சியில் மகிழுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*உண்மை பேசுவதே* — மிகச் சிறந்த அறம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*வணக்கம்! இன்று* — மனதில் அமைதியோடு இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*தெய்வ நம்பிக்கை* — மனதில் வேர் பிடிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*தளராத மனம்* — தான் உண்மையான வலிமை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*உங்கள் கனவு* — உங்களுக்கே சொந்தம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*தவறை உடனே திருத்துங்கள்* — தாமதிக்காதீர்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — இறைவன் நாமம் ஜெபியுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*அம்மன் ஆசீர்வாதம்* — ஒவ்வொரு காலடியிலும் இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நம்பிக்கையோடு நடந்தால்* — நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*அமைதியான மனம்* — ஆற்றலின் ஆதாரம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*சந்தோஷத்தை* — பகிர்ந்தால் இரட்டிப்பாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்!* — இன்று நேர்மையாக செயல்படுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*இறை சக்தி* — என்றும் உங்களை வழிநடத்தும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*பயத்தை விடு* — வெற்றியை அணைத்துக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று ஒரு நல்ல வார்த்தை சொல்லுங்கள்* — அது திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*நல்ல நோக்கம் இருந்தால்* — நல்ல வழி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று உங்கள் கனவுகளை* — நோக்கி ஒரு அடி முன்னேறுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*தெய்வீக அன்பு* — உங்கள் வாழ்வில் ஓடட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*உங்கள் கனவை யாரும் திருட முடியாது* — நம்புங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*பிறருக்கு நன்மை செய்வதே* — மிகப் பெரிய இன்பம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*அம்மன் சக்தி* — உங்களுக்கு வலிமை தரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*தினமும் கொஞ்சம்* — கொஞ்சமாக வளருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*நல்ல வார்த்தைகள் பேசுங்கள்* — நல்ல உறவுகள் கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்றும் இறைவன் அருளோடு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*இறைவன் ஆசியோடு* — இன்று நாளை முடிப்போம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*ஒரு நல்ல* — முடிவு வாழ்க்கையையே மாற்றும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*இன்று ஒரு* — நல்ல பழக்கத்தை தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*ஸ்ரீ முனியப்பன் அருளால்* — குடும்பம் சுபிட்சமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*போராடும் மனம்* — இருந்தால் தோல்வியே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*உங்கள் மகிழ்ச்சி உங்கள்* — கையில் தான் இருக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*காலை வணக்கம்! தெய்வ* — அருளோடு நாளை தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*வீரமாத்தி அம்மன் திருநாமம்* — ஜெபிக்கும் மனம் வேண்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*இன்று கஷ்டம் தான்* — நாளை கீர்த்தி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*அன்பாக பேசுங்கள்* — அன்பு பெறுவீர்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*இல்லறம் நல்லறம்* — குடும்பம் சிறப்பது முதன்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*நல்ல காலை! இன்று* — உங்கள் சிரிப்பு அழகாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*தெய்வ அருளை தினமும் உணர்வோம்* — வாழ்க்கை பொலிவடையும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*உண்மையான முயற்சி* — ஒருநாளும் வீணாகாது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*தினமும் கொஞ்சம் ஓய்வு எடுங்கள்* — மனம் புத்துணர்ச்சி பெறும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*நேரம் கடந்த* — பின் வருந்தினால் பயனில்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*காலை வணக்கம்!* — ஆரோக்கியமாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*அம்மன் தயையால்* — இன்றும் நேர்வழியில் செல்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*மனதில் நிம்மதி இருந்தால்* — வெற்றி தானே வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*யாரோடும் சண்டை போடாதீர்கள்* — சமாதானம் சிறப்பு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*கடலை கண்டாலும்* — கால் வாங்காதவன் மீனவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*நல்ல காலை!* — குடும்பத்தோடு மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*இறை அருளால் இன்று* — செய்யும் காரியம் வெற்றியடையும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*வாழ்க்கை ஒரு பயணம்* — தைரியமாக பயணியுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*உங்கள் குடும்பமே* — உங்கள் பலம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*உயரப் பறக்க வேண்டுமானால்* — சிறகை விரிக்க வேண்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*காலை வணக்கம்! இன்று* — எல்லாம் நன்றாக நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*வீரமாத்தி அம்மன்* — உங்கள் குடும்பத்தின் கவசம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*எழுந்திருக்கும் தைரியம்* — உள்ளவன் ஒருபோதும் தோல்வியடையான் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*தினமும் கொஞ்சம் சிரியுங்கள்* — ஆயுள் கூடும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கொடுத்தவன் குறைவடையான்* — இது உலக நியதி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*காலை வணக்கம்! ஸ்ரீ வீரமாத்தி* — அம்மன் இன்று உங்களை வழிநடத்தட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*இறை அருளால் இன்று* — செய்யும் காரியம் வெற்றியடையும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*சாதிக்க வேண்டும்* — என்ற ஆசையே போதும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*நல்ல எண்ணங்களோடு* — இன்று செல்லுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*மனிதன் மனிதனுக்கு உதவுவதே* — மிகப் பெரிய தர்மம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*நல்ல காலை! இன்று செய்யும்* — நல்ல காரியம் பலன் தரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முன நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் ", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில  🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💎", "*வாழ்க்கையை நேசியுங்கள்* — அது உங்களை நேசிக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌳", "*சொட்டு சொட்டாய் தண்ணீர்* — சேர்ந்தால் ஆழமான குளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌷", "*வணக்கம்! இன்றைய* — நாளை சிறப்பாக்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌱", "*இறைவன் அருளே வாழ்க்கையின்* — மிகப் பெரிய செல்வம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💚", "*முதலில் மனதை வெல்லுங்கள்* — உலகம் தானே வெல்லப்படும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⚡", "*மகிழ்ச்சியாக இருப்பது ஒரு தேர்வு* — தேர்ந்தெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🕊️", "*வேரோடு நின்ற* — மரம் புயலையும் தாங்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌊", "*வணக்கம்! இன்று உங்கள்* — முகத்தில் புன்னகை மலரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளி ்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦁", "*தெய்வீக சக்தி* — உங்களை என்றும் பாதுகாக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🦅", "*சிரிக்கிற முகம்* — தான் உலகையே வெல்லும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💧", "*யாரையும் வெறுக்காதீர்கள்* — அன்பே வெற்றி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏆", "*வீட்டில் அன்பு இருந்தால்* — வெளியில் வெற்றி கிடைக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🏠", "*காலை வணக்கம்! இன்று* — உங்கள் குடும்பம் சந்தோஷமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ❤️", "*முனியப்பன் அருள் பெற்று* — இன்று மகிழ்ச்சியாக இருங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌼", "*ஒவ்வொரு நாளும் ஒரு* — புதிய பாடம் கற்றுக்கொள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎯", "*இன்று ஒரு புன்னகை கொடுங்கள்* — ஒன்று திரும்பி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💖", "*முன்கோபம் முடிவை கெடுக்கும்* — பொறுமையாக இரு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎊", "*நல்ல காலை! இன்று* — நல்ல செய்தி கேட்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🎉", "*தெய்வத்தை நம்பும் மனம்* — எப்போதும் வலிமையாக இருக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🙏", "*நல்ல மனிதர்களோடு இரு* — நீயும் நல்லவனாவாய் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💪", "*மற்றவரின்* — துன்பத்தை புரிந்துகொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 😊", "*தண்ணீர் போல்* — தடைகளை கடந்து செல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌟", "*காலை வணக்கம்! இன்று* — ஒவ்வொரு நிமிடமும் அர்த்தமுள்ளதாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ✨", "*அம்மன் திருவடி சரணம்* — இன்று அனைத்தும் நன்றாகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌸", "*முயற்சி திருவினை ஆக்கும்* — இது உண்மை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌺", "*இன்று உங்கள்* — வாழ்க்கையில் நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌈", "*சிறகை விரித்தால்* — மட்டுமே வானில் பறக்கலாம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌿", "*வணக்கம்! இன்று அம்மன்* — அருளோடு நன்றாக கழிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ☀️", "*முனியப்பன் திருவிழி* — எங்கும் நம்மை காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🔱", "*மற்றவர்களை பார்க்காதே* — உன் வழியில் நட —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🚀", "*உதவி செய்யும் மனம்* — இருந்தால் யாரும் நண்பராவார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💝", "*கல்வி கற்றவன்* — கண் திறந்தவன் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 📚", "*நல்ல காலை! புதிய* — நாள் புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌄", "*தெய்வ நடை வழியே* — நடந்தால் கஷ்டமே இல்லை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🪔", "*நேரத்தை சரியாக பயன்படுத்துங்கள்* — வெற்றி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💡", "*இன்று ஒரு* — புதிய விஷயம் கற்றுக்கொள்ளுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌻", "*நாளை என்ன வரும் என்று அறியோம்* — இன்று நன்றாக வாழ்வோம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 🌾", "*காலை வணக்கம்!* — இன்று அற்புதமான நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். 💫", "*அம்மன் சரணம் சரணம்* — என்று சொல்லி தொடங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு* மலரட்டும். ⭐", "*இன்று செய்யும் நன்மை* — நாளை திரும்பி வரும் —\nஸ்ரீ வீரமாத்த
