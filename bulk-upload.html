let uploadedCount = 0;
let totalCount = MORNING_MESSAGES.length;

async function clearAndUpload() {
  document.getElementById('clearBtn').disabled = true;
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('statusText').textContent = '🗑 Clearing old morning messages...';

  try {
    await db.ref('kovil_messages/morning').remove();
    document.getElementById('statusText').textContent = '✅ Cleared! Starting upload...';
    setTimeout(() => startUpload(), 500);
  } catch(e) {
    document.getElementById('statusText').textContent = '❌ Clear failed: ' + e.message;
    document.getElementById('clearBtn').disabled = false;
  }
}

async function startUpload() {
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('clearBtn').disabled = true;
  uploadedCount = 0;

  const log = document.getElementById('log');
  log.innerHTML = '';

  for (let i = 0; i < MORNING_MESSAGES.length; i++) {
    const msg = MORNING_MESSAGES[i];
    const msgNum = 901 + i;

    try {
      await db.ref('kovil_messages/morning').push({
        text: msg,
        msgNum: msgNum,
        addedAt: Date.now()
      });

      uploadedCount++;
      const pct = Math.round((uploadedCount / totalCount) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('countText').textContent = `${uploadedCount} / ${totalCount} uploaded`;
      document.getElementById('statusText').textContent = `⬆️ Uploading M-${msgNum}...`;

      // Show preview of first few
      if (i < 3) {
        const div = document.createElement('div');
        div.className = 'msg-preview';
        div.innerHTML = `<b>M-${msgNum}:</b>\n${msg.substring(0, 80)}...`;
        log.appendChild(div);
      }

    } catch(e) {
      const div = document.createElement('div');
      div.className = 'msg-preview error';
      div.textContent = `❌ M-${msgNum} failed: ${e.message}`;
      log.appendChild(div);
    }

    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 50));
  }

  document.getElementById('statusText').innerHTML = `<span class="done">✅ Upload Complete! ${uploadedCount} messages saved to Firebase!</span>`;
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('countText').textContent = `${uploadedCount} / ${totalCount} ✅`;
}
</script>
