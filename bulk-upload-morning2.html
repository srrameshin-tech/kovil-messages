்பன் அருளில்;\n*வெற்றி வழி* காட்டும்,\nசாதனை *பெறுவீர்கள்.* 💫", "*அன்பான மனம்* உயரத்துக்கு கொண்டு செலும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிலைக்கட்டும்,\nவாழ்வு *அழகாகட்டும்.* ✨", "இன்று உங்கள் வாழ்க்கையில் *புதிய ஒளி* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல பாதை* அமையட்டும்,\nவெற்றி *காத்திருக்கிறது.* 🌟", "உங்கள் *முயற்சி* நீங்கள் உயர பண்ணும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*சாதனை* நிச்சயம்,\nவெற்றி *நிரந்தரம்.* 🚀", "*அமைதியான மனதில்* வெற்றி மலரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நம்பிக்கையுடன்* தொடங்குங்கள்,\nவாழ்வு *சிறக்கட்டும்.* 🌼", "*நன்மை நினைவு* நல்வாழ்வு தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்லதே நடக்கும்,*\nஆசீர்வாதம் *பெருகட்டும்.* 💫", "*தர்மத்தை* காப்பவர் உயர்வார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல பெயர்* கிடைக்கும்,\nவாழ்வு *செழிக்கட்டும்.* ✨", "உங்கள் *கனவுகள்* நிஜமாகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நாளை வெற்றியாகட்டும்,*\nமகிழ்ச்சி *நிறையட்டும்.* 🌈", "*உழைப்பு* உங்களை உயர்த்தும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*உச்சியை* நோக்குங்கள்,\nவெற்றி *நிச்சயம்.* 🎯", "*நேர்மையான பாதை* எளிதல்ல —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல முடிவு* தரும்,\nவாழ்வு *புனிதமாகட்டும்.* ✨", "நீங்கள் செய்யும் *நன்மை* நன்மையே தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்வு அழகு,*\nஆசீர்வாதம் *பெருகட்டும்.* 🌺", "*நம்பிக்கை* உங்கள் கையில் கத்தி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*பயத்தை* வெல்லும்,\nதைரியம் *எழட்டும்.* 💪", "உங்கள் *உள்ளத்தில்* அமைதி வளரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல எண்ணங்கள்* தரட்டும்,\nவாழ்வு *இனிமையாகட்டும்.* 🌿", "*சிரித்து* தொடங்குங்கள் — சுபதினம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*மகிழ்ச்சி* நிறையும்,\nவாழ்வு *அழகாகட்டும்.* 😊", "ஒவ்வொரு காலையும் ஒரு *புதிய blessing* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*இன்று வெற்றி,*\nநாளை *இன்னும் சிறப்பு.* 🌟", "*மனசு தைரியம்* இருந்தாலே போதும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நீங்கள் வெல்வீர்கள்,*\nவெற்றி *உங்களுக்காகவே.* 🚀", "உங்கள் *நல்ல உள்ளம்* உங்களை காப்பாற்றும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை திரும்பும்,*\nவாழ்வு *செழிக்கட்டும்.* ✨", "இன்று உங்கள் *turn* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Shine bright,*\nவெற்றி *உங்களது.* 🌈", "*நன்மை வழி* — அருள் துணை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*உயர்தர வாழ்வு,*\nவாழ்வு *மலரட்டும்.* 🎯", "*நல்ல மனம்* கருத்தில் நன்மை பெருகும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி வந்துவிட்டது,*\nமகிழ்ச்சி *நிறையட்டும்.* 💫", "இன்று உங்களுக்கு *அற்புதம்* காத்திருக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*நம்புங்கள்,*\nவெற்றி *நிச்சயம்.* 🌟", "செயலில் *sincerity* இருந்தால் success close —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*தொடர்ந்து* முன்னேறுங்கள்,\nவெற்றி *காத்திருக்கிறது.* 🚀", "*வெற்றி பாதைக்கு* இன்று first step —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Confidence high,*\nசாதனை *உறுதி.* ✨", "உங்கள் *மன உறுதி* உங்களை காக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*பயமில்லை,*\nவெற்றி *நிரந்தரம்.* 🌈", "*உழைப்பு + அருள்* = அசாதாரணம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Great outcome* வரட்டும்,\nவாழ்வு *பிரகாசிக்கட்டும்.* 🌟", "*மனிதத்துவம்* உங்கள் மதிப்பு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*அன்பு பெருகும்,*\nவாழ்வு *நல்லதாகட்டும்.* 💖", "உங்கள் நிலை *உயரத்துக்கு* destined —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Aim higher,*\nவெற்றி *நிச்சயம்.* 🚀", "காலை நேர *பிரார்த்தனை* = மன அமைதி —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Peace start,*\nவாழ்வு *இனிமையாகட்டும்.* 🌿", "*தோல்வி பாடம்* — வெற்றி பரிசு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Never quit,*\nவெற்றி *வரும்.* 🎯", "உங்கள் *திறமை* உங்களோடே பேசும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Show yourself,*\nசாதனை *நிரந்தரம்.* ✨", "*நல்ல எண்ணங்களை* பிடித்து வைத்து நடங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*அடுத்த படி* வையுங்கள்,\nவெற்றி *நெருங்கட்டும்.* 🚀", "உங்கள் வாழ்க்கை *அழகாகும்* இன்று —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Smile first,*\nமகிழ்ச்சி *நிரம்பட்டும்.* 🌈", "உங்கள் *பணி* உங்களை உயர்த்தும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Best day ahead,*\nவெற்றி *காத்திருக்கிறது.* 🌟", "*முயற்சி* = Progress —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*வாழ்க்கை முன்னேற்று,*\nவெற்றி *நிரந்தரம்.* 💪", "*நல்ல முடிவுகள்* only waiting —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Go boldly,*\nவெற்றி *நிச்சயம்.* ✨", "உங்கள் *சிரிப்பு* உங்கள் வெற்றி weapon —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Keep smiling,*\nவாழ்வு *அழகாகட்டும்.* 😊", "இன்று உங்கள் *Growth நாள்* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Level up,*\nவெற்றி *நிரந்தரம்.* 🚀", "உங்கள் பாதையில் *light more* —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Blessing loaded,*\nவாழ்வு *பிரகாசிக்கட்டும்.* ✨", "உங்கள் *உழைப்பு* பாராட்டப்படும் நாள் வருகிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Wait & win,*\nவெற்றி *நிச்சயம்.* 🌈", "*நன்மை* காத்திருக்கிறது — செல்லுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Opportunity today,*\nவெற்றி *உங்களது.* 🌟", "*மனவலிமை* = Success shortcut —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Go fearless,*\nவெற்றி *நிரந்தரம்.* 🚀", "உங்கள் *திறமையே* உங்கள் அடையாளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Own the day,*\nசாதனை *நிச்சயம்.* ✨", "*தொடர்ந்த முயற்சியே* magic —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Miracle happens,*\nவெற்றி *வரும்.* 🌈", "உங்கள் *சிந்தனை* உங்கள் எதிர்காலம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Think great,*\nவாழ்வு *உயரட்டும்.* 🎯", "உங்கள் வாழ்வில் *good twist* வருகிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Trust & move,*\nவெற்றி *காத்திருக்கிறது.* 🌟", "இன்று *நம்பிக்கை* கொண்டு நடங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Victory mode,*\nவெற்றி *நிரந்தரம்.* 💫", "உங்கள் *ஒளி* உலகுக்கு தெரியும் நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\n*Shine like sun,*\nவாழ்வு *பிரகாசிக்கட்டும்.* ✨", "*நாளை வெற்றியே* —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நம்பிக்கை* உயரட்டும்,\nவாழ்வு *மலரட்டும்.* ✨", "*மன உறுதி* உங்கள் பலம் —\nஸ்ரீ முனியப்பன் அருளில்;\n*முன்னேற்றம்* உருவாகட்டும்,\nவெற்றி *நிரந்தரம்.* 🌟", "*நல்ல எண்ணங்கள்* நன்மை தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*அமைதி* பொங்கட்டும்,\nவாழ்வு *இனிமையாகட்டும்.* 🌈", "*தைரியம்* இருந்தால் தடைகள் விலகும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிச்சயம்,\nசாதனை *வரட்டும்.* ⚡", "உங்கள் பாதை *ஒளியால்* நிரம்பட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*வாழ்வு மலரட்டும்,*\nவெற்றி *உங்களது.* ✨", "*துணிவே* உங்கள் பெருமை —\nஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல முடிவு* உங்கள் பக்கம்,\nவெற்றி *நிரந்தரம்.* 🔥", "*அன்பான இதயம்* அருள் பெறும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சுபநாள்* அமையட்டும்,\nவாழ்வு *பிரகாசிக்கட்டும்.* 🌸", "*முயற்சியில்* இறங்குங்கள் — பயம் வேண்டாம் —\nஸ்ரீ முனியப்பன் அருளில்;\n*மனம் வலிமையடையட்டும்,*\nவெற்றி *நிச்சயம்.* 💪", "*ஒளி* உங்கள் முகத்தில் பிரதிபலிக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நல்லதை ஈர்க்கட்டும்,*\nவாழ்வு *மலரட்டும்.* ✨", "உங்கள் *உழைப்பு* பலிக்கட்டும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*நன்மைகள்* வருக,\nவெற்றி *உங்களது.* 🌟", "*நம்பிக்கை* ஒரு தெய்வ வரம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*வெற்றி* உங்கள் பக்கம்,\nசாதனை *நிரந்தரம்.* 💫", "*உறுதியாய் நிற்கும் மனம்* உயரத்துக்கு செல்லும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*உங்களால் முடியும்,*\nவெற்றி *நிச்சயம்.* 🔥", "*உள்ளம் இலகுவாயின்* வாழ்க்கை இனிமை —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*மன அமைதி* கூடட்டும்,\nவாழ்வு *செழிக்கட்டும்.* 🌿", "*தைரியமான நடையின்* பயன் உயர்வு —\nஸ்ரீ முனியப்பன் அருளில்;\n*தடைகள்* நீங்கட்டும்,\nவெற்றி *வரட்டும்.* ⚡", "இன்று *நன்மை* ஏற்படும் நாள் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*மகிழ்ச்சி* தொடரட்டும்,\nவாழ்வு *அழகாகட்டும்.* 🌈", "உங்கள் *திறமை* வளரட்டும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*நல்ல பாதையில்* செல்லுங்கள்,\nவெற்றி *காத்திருக்கிறது.* 🔥", "*நல்ல உள்ளம்* சுப பலன் தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*மனநிறைவு* சேரட்டும்,\nவாழ்வு *மலரட்டும்.* 🌸", "*துயர் வந்தால்* அருளை நினையுங்கள் —\nஸ்ரீ முனியப்பன் அருளில்;\n*கவலை மறையட்டும்,*\nவாழ்வு *இனிமையாகட்டும்.* ✨", "உங்கள் *முயற்சி* நல்லதாய் மாறட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சாதனை* பெறுவீர்கள்,\nவெற்றி *நிரந்தரம்.* 🌟", "*நல்ல நேரம்* இன்று தான் —\nஸ்ரீ முனியப்பன் அருளில்;\n*புதிய வாய்ப்புகள்* வருக,\nவெற்றி *காத்திருக்கிறது.* ⚡", "*மனநிறைவு* வெற்றியை ஈர்க்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சந்தோஷம்* பெருகட்டும்,\nவாழ்வு *மலரட்டும்.* 🌸", "*துணிவு* இருந்தால் அற்புதம் வரும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*பயம்* நீங்கட்டும்,\nவெற்றி *நிரந்தரம்.* 🔥", "*சிரிப்பே* உங்கள் பாதுகாப்பு —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*மகிழ்ச்சி* என்றும் நிலை,\nவாழ்வு *அழகாகட்டும்.* 😊", "*சிக்கல் வந்தால்* வாய்ப்பு மறைவில் காத்திருக்கும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*முன்னேறுங்கள்,*\nவெற்றி *நிச்சயம்.* ⚡", "*நன்மையே* உங்கள் பாதை —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*இன்று சிறப்பு,*\nவாழ்வு *பிரகாசிக்கட்டும்.* ✨", "*நல்ல மனம்* நல்ல வாழ்வு —\nஸ்ரீ முனியப்பன் அருளில்;\n*உங்களோடு அருள்,*\nவெற்றி *வரட்டும்.* 🌟", "*ஒளி வழியில்* பயணம் தொடரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*வெற்றி நெருங்கட்டும்,*\nவாழ்வு *மலரட்டும்.* 🌈", "*துணிச்சலே* உங்கள் வெற்றி வழிகாட்டி —\nஸ்ரீ முனியப்பன் அருளில்;\n*இன்றே செயல்படுங்கள்,*\nசாதனை *நிரந்தரம்.* 🔥", "*அருள்* உங்கள் சுவாசத்தில் கலக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*அமைதி நிலை,*\nவாழ்வு *இனிமையாகட்டும்.* ✨", "*உங்களை நம்புங்கள்* — பாதை திறக்கும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி பக்கம்* செல்லுங்கள்,\nவாழ்வு *மலரட்டும்.* ⚡", "உங்கள் *முயற்சிக்கு* இன்று பலன் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சந்தோஷம்* நிரம்பட்டும்,\nவெற்றி *உங்களது.* ✨", "*துணிவான மனதில்* பயம் இல்லை —\nஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிச்சயம்,\nசாதனை *வரட்டும்.* 🔥", "*நன்மை நினைத்து* நடங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*அமைதி* நிலைக்கட்டும்,\nவாழ்வு *இனிமையாகட்டும்.* 🌿", "*தடைகள் வந்தாலும்* பின்னடைவு இல்லை —\nஸ்ரீ முனியப்பன் அருளில்;\n*உயர்ந்து செல்லுங்கள்,*\nவெற்றி *நிரந்தரம்.* ⚡", "இன்று *புது வாய்ப்பு* காத்திருக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நம்பிக்கை* மலரட்டும்,\nவாழ்வு *மலரட்டும்.* 🌈", "உங்கள் *எண்ணம் சுத்தமெனில்* வாழ்வு சுத்தம் —\nஸ்ரீ முனியப்பன் அருளில்;\n*வளம்* பெருகட்டும்,\nவெற்றி *நிச்சயம்.* ✨", "*நல்ல செயல்* நல்ல பெருமை தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*புகழ்* உயரட்டும்,\nவாழ்வு *செழிக்கட்டும்.* 🌺", "*தைரியம்* உங்கள் உயிர் —\nஸ்ரீ முனியப்பன் அருளில்;\n*முன்னேற்றம்* உயரட்டும்,\nவெற்றி *நிரந்தரம்.* 💪", "*அழகாய் வாழ* அருள் துணை —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நாள் நன்னாளாகட்டும்,*\nவாழ்வு *மலரட்டும்.* 🌸", "*உழைப்பில் அற்புதம்* —\nஸ்ரீ முனியப்பன் அருளில்;\n*பயன்கள்* பெருகட்டும்,\nவெற்றி *நிச்சயம்.* 🔥", "*மன அமைதி* வெற்றி தரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சுப சிந்தனை,*\nவாழ்வு *இனிமையாகட்டும்.* 🌟", "*பயத்தை விடுங்கள்* — நம்பிக்கையை பிடியுங்கள் —\nஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி விரைவில்,*\nசாதனை *வரட்டும்.* ⚡", "*நல்ல மனமே* நல்ல வரம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*ஆசீர்வாதம்* பெருக,\nவாழ்வு *மலரட்டும்.* ✨", "*செயலில் தவறாதீர்கள்* —\nஸ்ரீ முனியப்பன் அருளில்;\n*உயர்வு* உறுதி,\nவெற்றி *நிரந்தரம்.* 🔥", "*உள்ளத்தில் ஒளி* இருந்தால் வாழ்க்கை பிரகாசம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நற்பணிகள்* வெற்றிக்காக,\nவாழ்வு *மலரட்டும்.* 🌈", "*துணிவு* உங்களை தாங்கும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*முன்னேறுங்கள்* தொடர்ந்து,\nவெற்றி *நிச்சயம்.* ⚡", "*நம்பிக்கை* உங்கள் தோழன் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*கவலை* மறையும்,\nவாழ்வு *இனிமையாகட்டும்.* 🌸", "உங்கள் *திறமையால்* வெற்றி —\nஸ்ரீ முனியப்பன் அருளில்;\n*உறுதியாக* நடங்கள்,\nசாதனை *வரட்டும்.* 💪", "*நன்மை* உங்களை தேடி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*இன்றே தொடங்குங்கள்,*\nவெற்றி *நிரந்தரம்.* 🌟", "*வெற்றிக்கான கதவு* திறந்துவிட்டது —\nஸ்ரீ முனியப்பன் அருளில்;\n*நடந்து செல்லுங்கள்,*\nவெற்றி *காத்திருக்கிறது.* 🔥", "*மனத்தில் நலம்* — வாழ்வில் நலம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நன்மை* பெருகட்டும்,\nவாழ்வு *மலரட்டும்.* 🌿", "*தடைகள் சோதனைதான்* —\nஸ்ரீ முனியப்பன் அருளில்;\n*முடிவில் வெற்றி,*\nசாதனை *நிரந்தரம்.* ⚡", "உங்கள் *புன்னகை* அருளின் அடையாளம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*மகிழ்ச்சி* பொங்கட்டும்,\nவாழ்வு *இனிமையாகட்டும்.* 😊", "*முயற்சி தள்ளும்*, அருள் தாங்கும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*வெற்றி* நிச்சயம்,\nவாழ்வு *மலரட்டும்.* 🔥", "உங்கள் *உள்ளம் நல்லதாகட்டும்* —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*வாழ்வு அழகாகட்டும்,*\nவெற்றி *உங்களது.* ✨", "*முன்னால் நல்லவை* காத்திருக்கிறது —\nஸ்ரீ முனியப்பன் அருளில்;\n*சென்று அடையுங்கள்,*\nவெற்றி *நிரந்தரம்.* ⚡", "*சிறியது கூட முக்கியம்* —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நன்மை சேரட்டும்,*\nவாழ்வு *மலரட்டும்.* 🌸", "*உறுதியே* உங்கள் ஆயுதம் —\nஸ்ரீ முனியப்பன் அருளில்;\n*பயம் வேண்டாம்,*\nவெற்றி *நிச்சயம்.* 🔥", "இன்று *வாழ்வு* உயரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*ஆசீர்வாதம்* உங்களுக்கு,\nவாழ்வு *இனிமையாகட்டும்.* 🌈", "*நேர்மையே* நிஜ வெற்றி —\nஸ்ரீ முனியப்பன் அருளில்;\n*உயர்ந்து பாருங்கள்,*\nவெற்றி *நிரந்தரம்.* ⚡", "*மனம் விரிய* — வழி விரியும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நல் எதிர்காலம்,*\nவாழ்வு *மலரட்டும்.* ✨", "இன்று *சூப்பர் மாற்றம்* —\nஸ்ரீ முனியப்பன் அருளில்;\n*செயலில்* இறங்குங்கள்,\nவெற்றி *நிச்சயம்.* 🔥", "*பயம் கடந்தால்* வளர்ச்சி வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*நம்பிக்கை* நிலை,\nவாழ்வு *இனிமையாகட்டும்.* 🌸", "*நற்கருமம்* நற்செய்தி தரும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*உறுதி கொள்ளுங்கள்,*\nவெற்றி *வரட்டும்.* 💪", "*நல்ல காலம்* இன்று துவக்கம் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சந்தோஷம்* நிரம்பட்டும்,\nவாழ்வு *மலரட்டும்.* 🌟", "*உள்ளத்தில் கருணை* வளரட்டும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*துயரம்* நீங்கட்டும்,\nவாழ்வு *இனிமையாகட்டும்.* 🌿", "உங்கள் *முயற்சி* நாளை மாற்றும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*முயன்று வெல்லுங்கள்,*\nவெற்றி *நிரந்தரம்.* ✨", "*நன்றி உணர்வு* அருள் ஈர்க்கும் —\nஸ்ரீ முனியப்பன் அருளில்;\n*நன்மை* தொடரட்டும்,\nவாழ்வு *மலரட்டும்.* 🌈", "*நம்பிக்கையுடன் சிந்தித்தால்* நன்மை வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் அருளில்;\n*சுப நாள்,*\nவாழ்வு *இனிமையாகட்டும்.* 🌟", "*வெற்றி எளிதல்ல* — ஆனால் உங்கள் பக்கம் —\nஸ்ரீ முனியப்பன் அருளில்;\n*முடியுமே!*\nவெற்றி *நிரந்தரம்.* 🔥"];

async function startUpload(){
  document.getElementById('btn').disabled=true;
  let done=0;
  const total=MESSAGES.length;
  for(let i=0;i<total;i++){
    try{
      await db.ref('kovil_messages/morning').push({text:MESSAGES[i],msgNum:101+i,addedAt:Date.now()});
      done++;
      const pct=Math.round((done/total)*100);
      document.getElementById('bar').style.width=pct+'%';
      document.getElementById('bar').textContent=pct+'%';
      document.getElementById('count').textContent=done+' / '+total+' added';
      document.getElementById('status').textContent='⬆️ Uploading M-'+(101+i)+'...';
    }catch(e){
      console.error(e);
    }
    await new Promise(r=>setTimeout(r,50));
  }
  document.getElementById('status').innerHTML='<span class="done">✅ Done! '+done+' messages added!</span>';
}
</script>
