let uploaded=0;

async function clearAndUpload(){
  document.getElementById('clearBtn').disabled=true;
  document.getElementById('uploadBtn').disabled=true;
  document.getElementById('statusText').textContent='🗑 Clearing old night messages...';
  try{
    await db.ref('kovil_messages/night').remove();
    document.getElementById('statusText').textContent='✅ Cleared! Starting upload...';
    setTimeout(()=>startUpload(),500);
  }catch(e){
    document.getElementById('statusText').textContent='❌ Clear failed: '+e.message;
    document.getElementById('clearBtn').disabled=false;
  }
}

async function startUpload(){
  document.getElementById('uploadBtn').disabled=true;
  document.getElementById('clearBtn').disabled=true;
  uploaded=0;
  document.getElementById('log').innerHTML='';
  const total=NIGHT_MESSAGES.length;

  for(let i=0;i<total;i++){
    try{
      await db.ref('kovil_messages/night').push({text:NIGHT_MESSAGES[i],msgNum:101+i,addedAt:Date.now()});
      uploaded++;
      const pct=Math.round((uploaded/total)*100);
      document.getElementById('bar').style.width=pct+'%';
      document.getElementById('bar').textContent=pct+'%';
      document.getElementById('countText').textContent=uploaded+' / '+total+' uploaded';
      document.getElementById('statusText').textContent='⬆️ Uploading N-'+(101+i)+'...';
      if(i<3){
        const d=document.createElement('div');
        d.className='preview';
        d.innerHTML='<b>N-'+(101+i)+':</b>\n'+NIGHT_MESSAGES[i].substring(0,80)+'...';
        document.getElementById('log').appendChild(d);
      }
    }catch(e){
      const d=document.createElement('div');
      d.className='preview';
      d.style.color='red';
      d.textContent='❌ N-'+(101+i)+' failed: '+e.message;
      document.getElementById('log').appendChild(d);
    }
    await new Promise(r=>setTimeout(r,50));
  }

  document.getElementById('statusText').innerHTML='<span class="done">✅ Upload Complete! '+uploaded+' messages saved!</span>';
  document.getElementById('bar').style.width='100%';
  document.getElementById('bar').textContent='100%';
  document.getElementById('countText').textContent=uploaded+' / '+total+' ✅';
}
</script>
</body>
</html>
