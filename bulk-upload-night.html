் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 🌷", "*இன்று சந்தோஷமாக* இருந்தீர்களா? —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவும் *சந்தோஷமாகட்டும்.* 😊", "*நேர்மையாக வாழ்ந்தீர்கள்* — தெய்வம் காக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஇரவு *நிம்மதியாகட்டும்.* ✨", "*இரவு வானில்* நட்சத்திரங்கள் போல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *ஒளிரட்டும்.* 🌟", "*பயமில்லை* — தெய்வம் காவலாய் நிற்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 🛡️", "*இரவின் நிம்மதி* உங்களுக்கே சொந்தம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🌙", "*நல்ல வார்த்தை* பேசினீர்கள் — நல்லது வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 💫", "*முனியப்பன் அனுக்கிரகம்* இரவும் தொடரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 🌺", "*இன்று உதவினீர்களா?* — புண்ணியம் கூடும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🙏", "*இரவு வணக்கம்!* அருள் உங்களோடு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌸", "*நல்ல உறக்கம்* நல்ல நாளுக்கு அடித்தளம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* ⭐", "*அம்மன் பாசம்* இரவும் உங்களை தழுவட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 💖", "*இன்றை நாளை* நன்றியுடன் முடிப்போம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* ✨", "*தெய்வம் விழித்திருக்கிறது* — நீங்கள் தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 🌙", "*குடும்பம் நலமாய்* இருந்தால் எல்லாம் நலம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🏠", "*இரவின் அமைதியில்* கடவுளை நினையுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🪔", "*நல்ல இரவு!* நாளை நல்லதே நடக்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 🌟", "*பொறுமையாக* இருந்தீர்கள் — பலன் வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🌿", "*இரவு வணக்கம்!* மனம் இலகுவாகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 💫", "*அன்பான உள்ளம்* ஆசீர்வாதம் பெறும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 💝", "*இரவும் பகலும்* தெய்வம் காக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🔱", "*நல்ல எண்ணங்களோடு* தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌸", "*உழைத்தீர்கள்* — இப்போது ஓய்வெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 💪", "*இரவின் இருளில்* தெய்வ ஒளி விளங்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* ✨", "*நல்லவர்களோடு* நாளை கழிந்தது — நல்லது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🌟", "*இரவு வணக்கம்!* அருளில் ஓய்வெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 🌙", "*கோபத்தை விட்டு* மனம் சாந்தமாகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🕊️", "*இன்றை நினைவுகள்* மகிழ்ச்சியாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 😊", "*தெய்வ சரணம்* சொல்லி தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 🙏", "*இரவு நிம்மதி* இறைவன் தரும் பரிசு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🎁", "*நாளை வெற்றிக்காக* இன்று ஓய்வெடுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* ⭐", "*அம்மன் கருணை* இரவும் பரவட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🌺", "*இன்று நன்றாக* வாழ்ந்தீர்கள் — நன்று —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🌈", "*இரவு வணக்கம்!* ஸ்ரீ வீரமாத்தி அம்மன் துணை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவுகள் *மலரட்டும்.* 🌸", "*மனம் அமைதியாகட்டும்* — உடல் ஓய்வு பெறட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 💚", "*இரவு காவலாய்* முனியப்பன் நிற்கிறார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nபயமில்லாமல் *தூங்குங்கள்.* 🛡️", "*நன்மை செய்தீர்கள்* — நன்மை வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* ✨", "*தெய்வ ஆசீர்வாதத்தில்* இரவு கழியட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌙", "*ஒவ்வொரு இரவும்* புது வலிமை சேர்க்கும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 💪", "*நல்ல இரவு!* குடும்பம் நலமாக இருக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🏠", "*இரவு வணக்கம்!* அருள் நிரம்பட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🌟", "*சோர்வு நீங்கட்டும்* — புத்துணர்ச்சி வரட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 🌿", "*இரவு புனிதம்* — தெய்வம் அருகில் இருக்கிறது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🪔", "*அமைதியான இரவு* — அழகான காலை வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌄", "*இன்று நேர்மையாக* இருந்தீர்கள் — நல்லது —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* ⭐", "*முனியப்பன் சரணம்* — இரவு நிம்மதியாகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🔱", "*இரவு வணக்கம்!* நாளை மேலும் சிறப்பு —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🚀", "*கடவுளை நினைத்து* தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 🙏", "*இரவின் நட்சத்திரங்கள்* போல் மின்னட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nவாழ்வு *ஒளிரட்டும்.* ✨", "*அன்று செய்த தவறை* மன்னியுங்கள் — தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🕊️", "*நல்ல இரவு!* இறைவன் துணை நிற்கிறார் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌸", "*உடல் நலம் பெறட்டும்* — மனம் ஓய்வு பெறட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 💚", "*இரவு வணக்கம்!* வீரமாத்தி அம்மன் காக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🌺", "*மகிழ்ச்சியான இரவு* — நாளை மகிழ்ச்சியான காலை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 😊", "*இரவு புனித நேரம்* — இறைவனோடு பேசுங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 🌙", "*அம்மன் அருளில்* இரவு சாந்தமாகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 💫", "*நல்ல இரவு!* பயமில்லை — தெய்வம் காவல் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🛡️", "*இரவு வணக்கம்!* நாளை நல்லதே வரும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* ⭐", "*முனியப்பன் காப்பில்* இரவு கழியட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *சுகமாகட்டும்.* 🔱", "*தெய்வ நாமம்* ஜெபித்து தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🪔", "*இரவு சாந்தமாய்* கழியட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *இனிதாகட்டும்.* 🌿", "*நல்ல தூக்கம்* நல்ல வாழ்க்கைக்கு அவசியம் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 💡", "*இரவு வணக்கம்!* அருள் மழை பொழியட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *இனிமையாகட்டும்.* 🌧️", "*கவலைகள் இரவோடு* போகட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *சுகமாகட்டும்.* 🌟", "*நல்ல இரவு!* நாளை புதிய நம்பிக்கை —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nஓய்வு *இனிமையாகட்டும்.* 🌄", "*அம்மன் பாதம்* மனதில் வைத்து தூங்குங்கள் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nகனவு *நல்லதாகட்டும்.* 🌺", "*இரவு வணக்கம்!* அமைதியான ஓய்வு கிடைக்கட்டும் —\nஸ்ரீ வீரமாத்தி அம்மன் & ஸ்ரீ முனியப்பன் அருளில்;\nதூக்கம் *நிம்மதியாகட்டும்.* 🌸", "*இன்று வாழ்ந்தீர்க "];

async function startUpload(){
  document.getElementById('btn').disabled=true;
  let done=0;
  for(let i=0;i<MSGS.length;i++){
    try{
      await db.ref('kovil_messages/night').push({text:MSGS[i],msgNum:i+1,addedAt:Date.now()});
      done++;
      const pct=Math.round((done/MSGS.length)*100);
      document.getElementById('bar').style.width=pct+'%';
      document.getElementById('bar').textContent=pct+'%';
      document.getElementById('count').textContent=done+' / '+MSGS.length;
      document.getElementById('status').textContent='⬆️ Uploading N-'+(i+1)+'...';
    }catch(e){console.error(e);}
    await new Promise(r=>setTimeout(r,50));
  }
  document.getElementById('status').innerHTML='<span class="done">✅ Done! '+done+' messages added! இரவு மொத்தம் 1000!</span>';
}
</script>
